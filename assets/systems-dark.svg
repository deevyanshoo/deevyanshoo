<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" data-theme="dark">
<title>Things I built because I could</title>
<defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#15202a"/></pattern></defs>
<style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.e{font-size:12px;font-weight:700;letter-spacing:1.7px}.t{font-size:22px;font-weight:800}.b{font-size:13px}.x{font-size:11px;letter-spacing:.4px}.k{font-size:24px;font-weight:800}</style>
<rect width="1200" height="360" rx="18" fill="#090d12"/><rect x="1" y="1" width="1198" height="358" rx="17" fill="#0c1218" stroke="#24303a"/><rect x="1" y="1" width="1198" height="358" rx="17" fill="url(#g)" opacity=".45"/>
<text x="28" y="36" class="m e" fill="#ffb000">THINGS I BUILT BECAUSE I COULD // 02</text><text x="1170" y="36" class="m x" fill="#7f8a98" text-anchor="end">distributed systems  &gt;  large-scale ML  &gt;  edge AI</text><line x1="28" y1="54" x2="1172" y2="54" stroke="#24303a"/><line x1="400" y1="78" x2="400" y2="316" stroke="#24303a"/><line x1="800" y1="78" x2="800" y2="316" stroke="#24303a"/>
<text x="28" y="88" class="m e" fill="#63d5c3">01 // JARVIS</text><text x="28" y="120" class="s t" fill="#f5f7fa">HYBRID AI</text><text x="28" y="146" class="s b" fill="#cbd5df">personal assistant on a phone</text><rect x="44" y="178" width="74" height="102" rx="12" fill="none" stroke="#cbd5df" stroke-width="2"/><rect x="155" y="205" width="82" height="46" rx="8" fill="none" stroke="#ffb000" stroke-width="1.5"/><text x="196" y="232" class="m x" fill="#ffb000" text-anchor="middle">ROUTER</text><line x1="118" y1="229" x2="155" y2="229" stroke="#7f8a98"/><line x1="237" y1="217" x2="290" y2="190" stroke="#ffb000"/><line x1="237" y1="239" x2="290" y2="265" stroke="#63d5c3"/><rect x="290" y="168" width="82" height="45" rx="7" fill="none" stroke="#ffb000"/><text x="331" y="188" class="m x" fill="#ffb000" text-anchor="middle">LOCAL</text><text x="331" y="204" class="m x" fill="#cbd5df" text-anchor="middle">SLM</text><rect x="290" y="244" width="82" height="45" rx="7" fill="none" stroke="#63d5c3"/><text x="331" y="264" class="m x" fill="#63d5c3" text-anchor="middle">CLOUD</text><text x="331" y="280" class="m x" fill="#cbd5df" text-anchor="middle">LLM</text><text x="28" y="318" class="m x" fill="#7f8a98">privacy HIGH // latency LOW // cloud optional</text>
<text x="428" y="88" class="m e" fill="#63d5c3">02 // DAG LEDGER</text><text x="428" y="120" class="s t" fill="#f5f7fa">DISTRIBUTED SYSTEMS</text><text x="428" y="146" class="s b" fill="#cbd5df">peer-approved blocks without a linear chain</text><g stroke="#7f8a98" stroke-width="1.5" opacity=".75"><line x1="475" y1="205" x2="560" y2="176"/><line x1="475" y1="205" x2="535" y2="265"/><line x1="560" y1="176" x2="645" y2="210"/><line x1="560" y1="176" x2="535" y2="265"/><line x1="645" y1="210" x2="535" y2="265"/><line x1="645" y1="210" x2="745" y2="188"/><line x1="645" y1="210" x2="690" y2="270"/><line x1="535" y1="265" x2="690" y2="270"/><line x1="745" y1="188" x2="690" y2="270"/></g><g fill="#0c1218" stroke-width="2"><circle cx="475" cy="205" r="8" stroke="#ffb000"/><circle cx="560" cy="176" r="8" stroke="#ffb000"/><circle cx="645" cy="210" r="8" stroke="#63d5c3"/><circle cx="535" cy="265" r="8" stroke="#ffb000"/><circle cx="690" cy="270" r="8" stroke="#63d5c3"/><circle cx="745" cy="188" r="8" stroke="#63d5c3"/></g><text x="428" y="318" class="m x" fill="#7f8a98">DAG growth // P2P approvals // custom consensus</text>
<text x="828" y="88" class="m e" fill="#63d5c3">03 // AVIATION</text><text x="828" y="120" class="s t" fill="#f5f7fa">FORECASTING AT SCALE</text><text x="828" y="146" class="s b" fill="#cbd5df">demand prediction 65 days ahead</text><text x="828" y="200" class="s k" fill="#ffb000">&gt;90%</text><text x="910" y="198" class="m x" fill="#7f8a98">forecast accuracy</text><text x="828" y="238" class="s k" fill="#f5f7fa">~800 TB/day</text><text x="970" y="236" class="m x" fill="#7f8a98">data environment</text><line x1="828" y1="285" x2="1150" y2="285" stroke="#24303a"/><line x1="975" y1="260" x2="975" y2="306" stroke="#24303a" stroke-dasharray="4 4"/><polyline points="828,287 860,272 892,279 924,248 956,259 988,240 1020,246 1052,220 1084,229 1116,208 1148,214" fill="none" stroke="#cbd5df" stroke-width="2"/><polyline points="975,257 1008,246 1041,236 1074,224 1107,215 1148,205" fill="none" stroke="#ffb000" stroke-width="2" stroke-dasharray="5 4"/><text x="828" y="310" class="m x" fill="#7f8a98">D+00</text><text x="975" y="310" class="m x" fill="#ffb000" text-anchor="middle">FORECAST</text><text x="1150" y="310" class="m x" fill="#7f8a98" text-anchor="end">D+65</text><text x="1170" y="338" class="m x" fill="#7f8a98" text-anchor="end">not demos // systems that had to work</text>
</svg>