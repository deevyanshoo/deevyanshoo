<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" data-theme="light">
<title>Things I built because I could</title>
<desc>JARVIS hybrid inference, a DAG ledger, and large-scale aviation forecasting.</desc>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#edf1f5" stroke-width="1"/></pattern>
<linearGradient id="pulse" x1="0" x2="1"><stop stop-color="#a66200"/><stop offset="1" stop-color="#087f78"/></linearGradient>
</defs>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace}
.name{font-size:48px;font-weight:800;letter-spacing:-1.4px}
.role{font-size:14px;font-weight:700;letter-spacing:1.6px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.8px}
.tag{font-size:25px;font-weight:700;letter-spacing:-.4px}
.body{font-size:15px}
.small{font-size:12px}
.micro{font-size:11px;letter-spacing:.7px}
.portrait{font-size:13px;font-weight:700;white-space:pre}
.mission{font-size:28px;font-weight:800}
.card-title{font-size:22px;font-weight:800}
.metric{font-size:24px;font-weight:800}
</style>
<rect width="1200" height="380" rx="18" fill="#fbfcfe"/>
<rect x="1" y="1" width="1198" height="378" rx="17" fill="#ffffff" stroke="#d8dee7"/>
