<text x="28" y="36" class="mono eyebrow" fill="#a66200">THINGS I BUILT BECAUSE I COULD // 02</text>
<text x="1170" y="36" class="mono small" fill="#6b7280" text-anchor="end">distributed systems  &gt;  large-scale ML  &gt;  edge AI</text>
