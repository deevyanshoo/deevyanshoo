name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install portrait test dependency
        run: python -m pip install ".[portrait]"

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Verify deterministic assets
        run: |
          python scripts/generate.py --offline --output-dir "$RUNNER_TEMP/profile-first"
          python scripts/generate.py --offline --output-dir "$RUNNER_TEMP/profile-second"
          cmp "$RUNNER_TEMP/profile-first/profile-dark.svg" "$RUNNER_TEMP/profile-second/profile-dark.svg"
          cmp "$RUNNER_TEMP/profile-first/profile-light.svg" "$RUNNER_TEMP/profile-second/profile-light.svg"
          cmp "$RUNNER_TEMP/profile-first/systems-dark.svg" "$RUNNER_TEMP/profile-second/systems-dark.svg"
          cmp "$RUNNER_TEMP/profile-first/systems-light.svg" "$RUNNER_TEMP/profile-second/systems-light.svg"
